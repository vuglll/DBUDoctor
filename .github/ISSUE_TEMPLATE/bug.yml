name: Bug report
description: DBUDoctor crashed, failed, or did something it should not.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dbudoctor --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [GitHub Action, pip, dotnet tool, release binary, built from source]
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: Databricks CLI version
      description: Output of `databricks --version`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what happened instead. Paste the error output.
      render: text
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Bundle snippet
      description: The smallest part of `databricks.yml` (or `bundle validate --output json`) that shows the problem. Remove hosts, IDs and anything private.
      render: yaml
