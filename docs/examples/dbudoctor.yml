# .github/workflows/dbudoctor.yml: estimate the cost of every pull request that touches a bundle.
name: DBUDoctor

on:
  pull_request:
    paths:
      - "**/databricks.yml"
      - "**/*.yml"
      - ".dbudoctor.yml"

# Least privilege: read the code, write one pull request comment. On pull requests from forks the
# token cannot write, and the report goes to the job summary instead.
permissions:
  contents: read
  pull-requests: write

jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # DBUDoctor checks the base commit out into a temporary worktree

      - uses: databricks/setup-cli@main

      - uses: vuglll/DBUDoctor/action@v0
        env:
          # `databricks bundle validate` resolves the bundle against the workspace, so it needs
          # credentials. A read-only service principal is enough.
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        with:
          target: prod
