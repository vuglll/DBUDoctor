name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DBUDoctor.slnx

      - name: Build
        run: dotnet build DBUDoctor.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DBUDoctor.slnx --no-build --configuration Release

      # The agent skill is generated from rule metadata and committed; it must match a fresh generation.
      - name: Check the committed agent skill
        run: |
          dotnet run --project src/DBUDoctor.Cli --no-build --configuration Release -- skill export --dir skills/dbudoctor --force
          if ! git diff --exit-code --stat -- skills/; then
            echo "::error::skills/dbudoctor is stale. Run: dotnet run --project src/DBUDoctor.Cli -- skill export --dir skills/dbudoctor --force"
            exit 1
          fi
