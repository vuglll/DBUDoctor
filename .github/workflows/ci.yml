name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DBUDoctor.slnx

      - name: Build
        run: dotnet build DBUDoctor.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DBUDoctor.slnx --no-build --configuration Release

      # The agent skill is generated from rule metadata and committed; it must match a fresh generation.
      - name: Check the committed agent skill
        run: |
          dotnet run --project src/DBUDoctor.Cli --no-build --configuration Release -- skill export --dir skills/dbudoctor --force
          if ! git diff --exit-code --stat -- skills/; then
            echo "::error::skills/dbudoctor is stale. Run: dotnet run --project src/DBUDoctor.Cli -- skill export --dir skills/dbudoctor --force"
            exit 1
          fi

  publish-aot:
    # Native AOT needs the platform's own toolchain, so each RID publishes on its own runner.
    # AOT and trim warnings are errors (TreatWarningsAsErrors). Linux builds on Ubuntu 22.04, so the
    # binary runs on glibc 2.34 and later (Databricks Runtime 13.3 LTS and later run Ubuntu 22.04).
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-22.04
          - rid: linux-arm64
            os: ubuntu-22.04-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: dotnet publish src/DBUDoctor.Cli --configuration Release --runtime ${{ matrix.rid }} --output publish

      - name: Smoke test
        shell: bash
        run: |
          ./publish/dbudoctor --version
          ./publish/dbudoctor diff \
            --base-json tests/Fixtures/bundles/azure-analytics/base.json \
            --head-json tests/Fixtures/bundles/azure-analytics/head.json \
            --config tests/Fixtures/bundles/azure-analytics/.dbudoctor.yml \
            --format json > report.json || test $? -eq 1
          grep -q '"schemaVersion": 1' report.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Builds this platform's PyPI wheel, installs it in a fresh virtual environment and runs it.
      - name: Wheel
        shell: bash
        env:
          DBUDOCTOR_RID: ${{ matrix.rid }}
          DBUDOCTOR_BINARY: ${{ github.workspace }}/publish/dbudoctor${{ matrix.rid == 'win-x64' && '.exe' || '' }}
        run: |
          export DBUDOCTOR_VERSION="$(./publish/dbudoctor --version | cut -d+ -f1)"
          python -m unittest discover -s tools/wheels -v
          python tools/wheels/build_wheel.py --rid "$DBUDOCTOR_RID" --binary "$DBUDOCTOR_BINARY" --version "$DBUDOCTOR_VERSION" --readme README.md --license LICENSE --out wheels

      - name: Tests on this platform
        if: matrix.rid == 'win-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: dotnet test DBUDoctor.slnx --configuration Release
